<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#141414">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<title>Djlvorne</title>
<style>
/* ================= design tokens ================= */
:root{
  --bg:#141414; --panel:#1b1b1b; --raise:#242424; --line:#2a2a2a; --line2:#383838;
  --txt:#ececec; --mute:#8e8e8e; --dim:#686868;
  --acc:#7aa2f7;            /* the ONE accent colour. Change it here only. */
  --err:#e58a8a; --warn:#e0b15c;
  --serif:ui-serif,Georgia,"Times New Roman",serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--txt);font:15.5px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;overflow:hidden}
button,input,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;padding:0}
button:disabled{cursor:default;opacity:.5}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic.sm{width:16px;height:16px}.ic.xs{width:14px;height:14px}.ic.lg{width:26px;height:26px}
.ib{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--mute);transition:background .15s,color .15s}
.ib:hover{background:var(--raise);color:var(--txt)}

/* ================= view switching ================= */
body[data-view=loading] #auth, body[data-view=loading] #app{display:none}
body[data-view=auth] #app{display:none}
body[data-view=app] #auth{display:none}
#app{height:100dvh;display:flex;flex-direction:column}

/* ================= auth screen ================= */
#auth{position:fixed;inset:0;z-index:60;background:var(--bg);overflow:auto;display:flex;padding:24px 16px}
.acard{margin:auto;width:100%;max-width:392px}
.brand{font:400 40px/1.1 var(--serif);letter-spacing:-.01em;margin:0 0 6px}
.tagline{color:var(--mute);margin:0 0 28px}
.seg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:3px;margin-bottom:20px}
.seg button{flex:1;padding:9px 0;border-radius:9px;color:var(--mute);transition:background .15s,color .15s}
.seg button.on{background:var(--raise);color:var(--txt)}
.fld{display:block;margin-bottom:14px}
.fld>span{display:block;font-size:13px;color:var(--mute);margin-bottom:6px}
.fld input{width:100%;background:var(--panel);border:1px solid var(--line2);border-radius:12px;padding:12px 14px;outline:0;transition:border-color .15s}
.fld input:focus{border-color:var(--acc)}
.hint{display:block;font-size:12.5px;color:var(--warn);margin-top:7px;line-height:1.45}
.chk{display:flex;align-items:center;gap:8px;color:var(--mute);font-size:13.5px;margin:2px 0 16px;cursor:pointer}
.chk input{accent-color:var(--acc)}
.primary{width:100%;padding:12px;border-radius:12px;background:var(--acc);color:#0b0b0b;font-weight:600;transition:filter .15s}
.primary:hover:not(:disabled){filter:brightness(1.08)}
.err{color:var(--err)}
#aerr{min-height:20px;font-size:13.5px;margin:0 0 10px}
.afoot{color:var(--dim);font-size:12.5px;margin:20px 0 0;line-height:1.5}

/* ================= header + mode tabs ================= */
header{display:grid;grid-template-columns:48px 1fr 48px;align-items:center;
  padding:calc(6px + env(safe-area-inset-top)) 8px 4px}
.word{text-align:center;font:400 21px/1 var(--serif);letter-spacing:.01em}
.av{width:32px;height:32px;border-radius:50%;background:var(--raise);border:1px solid var(--line2);display:grid;place-items:center;
  font-size:13px;font-weight:600;color:var(--txt);justify-self:center;text-transform:uppercase}
.av.lg{width:52px;height:52px;font-size:20px}
#tabs{display:flex;gap:2px;overflow-x:auto;padding:6px 10px 10px;border-bottom:1px solid var(--line);scrollbar-width:none}
#tabs::-webkit-scrollbar{display:none}
#tabs>.tab:first-child{margin-left:auto}#tabs>.tab:last-child{margin-right:auto}
.tab{display:flex;align-items:center;gap:7px;padding:8px 14px;border-radius:999px;color:var(--mute);font-size:14px;white-space:nowrap;transition:background .15s,color .15s}
.tab:hover{color:var(--txt)}
.tab.on{background:var(--raise);color:var(--txt)}
.tab.on .ic{color:var(--acc)}
@media(max-width:560px){.tab span{display:none}.tab.on span{display:inline}.tab{padding:8px 13px}}

/* ================= sidebar ================= */
#side{position:fixed;top:0;bottom:0;left:0;width:min(320px,84vw);background:var(--panel);border-right:1px solid var(--line);
  transform:translateX(-100%);transition:transform .22s ease;z-index:30;display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top)}
#side.open{transform:none}
#scrim{position:fixed;inset:0;background:#0009;z-index:25;opacity:0;pointer-events:none;transition:opacity .2s}
#scrim.on{opacity:1;pointer-events:auto}
.sh{display:flex;align-items:center;justify-content:space-between;padding:10px 8px 4px 18px}
#sidehead{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
#newchat{display:flex;align-items:center;gap:10px;margin:8px 12px 10px;padding:11px 14px;border:1px solid var(--line2);border-radius:12px;transition:background .15s}
#newchat:hover{background:var(--raise)}
#list{flex:1;overflow-y:auto;padding:0 8px}
.ci{display:flex;align-items:center;border-radius:10px;padding-right:2px}
.ci:hover,.ci.cur{background:var(--raise)}
.ci .ti{flex:1;min-width:0;text-align:left;padding:9px 10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14.5px}
.ci .ac{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--dim);opacity:0;transition:opacity .15s}
.ci:hover .ac,.ci.cur .ac,.ci .ac.on{opacity:1}
.ci .ac:hover{color:var(--txt)}
.ci .ac.on{color:var(--acc)}
.snone{color:var(--dim);font-size:13.5px;padding:10px 12px}
.sfoot{display:flex;align-items:center;gap:10px;margin:8px;padding:10px;border-radius:12px;text-align:left;transition:background .15s;
  margin-bottom:calc(8px + env(safe-area-inset-bottom))}
.sfoot:hover{background:var(--raise)}
.sfoot span.em{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px;color:var(--mute)}

/* ================= conversation ================= */
#log{flex:1;overflow-y:auto;padding:22px 16px 12px;scroll-behavior:smooth}
.col{max-width:740px;margin:0 auto}
.empty{text-align:center;padding:9vh 4px 0}
.eglyph{width:52px;height:52px;border-radius:16px;margin:0 auto 18px;display:grid;place-items:center;color:var(--acc);background:var(--panel);border:1px solid var(--line)}
.empty h2{font:400 30px/1.2 var(--serif);margin:0 0 8px;letter-spacing:-.005em}
.empty p{color:var(--mute);margin:0 auto 24px;max-width:420px}
.chips{display:flex;flex-direction:column;gap:8px;max-width:440px;margin:0 auto}
.chip{padding:12px 16px;border:1px solid var(--line);border-radius:14px;text-align:left;color:var(--mute);font-size:14.5px;transition:border-color .15s,color .15s,background .15s}
.chip:hover{border-color:var(--line2);color:var(--txt);background:var(--panel)}

.m{margin:0 0 26px}
.m.u{display:flex;flex-direction:column;align-items:flex-end}
.m.u .t{background:var(--raise);padding:10px 16px;border-radius:20px 20px 6px 20px;max-width:86%;white-space:pre-wrap;overflow-wrap:anywhere}
.tag{font-size:12px;color:var(--mute);margin:0 6px 4px}
.m.a p{margin:0 0 .75em;overflow-wrap:anywhere}
.m.a p:last-child{margin-bottom:0}
.m.a h4{font:600 15.5px/1.4 system-ui,sans-serif;margin:1.1em 0 .4em}
.m.a ul,.m.a ol{margin:0 0 .75em;padding-left:1.35em}
.m.a li{margin:.2em 0}
.m.a code{font:13.5px ui-monospace,Menlo,Consolas,monospace;background:var(--raise);padding:1px 6px;border-radius:6px}
.code{background:#0e0e0e;border:1px solid var(--line);border-radius:14px;margin:10px 0;overflow:hidden}
.code pre{margin:0;padding:14px 16px;white-space:pre-wrap;overflow-wrap:anywhere;font:13.5px/1.6 ui-monospace,Menlo,Consolas,monospace}
.cp{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:9px;color:var(--mute);font-size:13px;transition:background .15s,color .15s}
.cp:hover{background:var(--raise);color:var(--txt)}
.code .cp{display:flex;margin:0 8px 8px auto}
.m.a>.cp.all{margin-top:6px;margin-left:-6px}
.gen{display:block;margin:0 0 4px;padding:8px 16px;border-radius:10px;border:1px solid var(--acc);color:var(--acc);font-size:14px;transition:background .15s}
.gen:hover:not(:disabled){background:color-mix(in srgb,var(--acc) 14%,transparent)}
.out{margin:8px 0 14px}
.out img,.out video{display:block;max-width:100%;border-radius:14px;border:1px solid var(--line)}
.out a{display:inline-block;margin-top:6px;font-size:13px;color:var(--mute)}
.note{color:var(--mute);font-size:13.5px;padding:2px 0}
.note.err{color:var(--err)}
.dots{display:flex;gap:5px;padding:8px 0}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--dim);animation:blink 1.1s infinite ease-in-out}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}

/* ================= composer ================= */
#bar{padding:6px 14px calc(12px + env(safe-area-inset-bottom))}
#thumb{display:none;position:relative;width:64px;margin:0 0 10px 4px}
#thumb img{display:block;width:64px;height:64px;object-fit:cover;border-radius:12px;border:1px solid var(--line2)}
#thumb button{position:absolute;top:-7px;right:-7px;width:22px;height:22px;border-radius:50%;background:var(--raise);border:1px solid var(--line2);display:grid;place-items:center}
.box{background:var(--panel);border:1px solid var(--line2);border-radius:24px;padding:10px 10px 8px 14px;transition:border-color .15s}
.box:focus-within{border-color:color-mix(in srgb,var(--acc) 50%,var(--line2))}
textarea{display:block;width:100%;resize:none;background:none;border:0;outline:0;padding:4px 4px 6px 0;max-height:30vh;line-height:1.5}
textarea::placeholder{color:var(--dim)}
.row{display:flex;align-items:center;gap:4px;position:relative;margin-left:-6px}
#add{width:36px;height:36px}
#model{display:flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;color:var(--mute);font-size:13.5px;max-width:58vw;transition:background .15s,color .15s}
#model span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#model:hover{background:var(--raise);color:var(--txt)}
#send{margin-left:auto;width:38px;height:38px;background:var(--raise);color:var(--dim)}
#send.ready{background:var(--acc);color:#0b0b0b}
#send.ready:hover{filter:brightness(1.08);background:var(--acc)}
#pop{display:none;position:absolute;left:0;bottom:calc(100% + 10px);background:var(--panel);border:1px solid var(--line2);border-radius:16px;
  padding:6px;min-width:260px;max-width:calc(100vw - 28px);z-index:20;box-shadow:0 12px 40px #000a}
#pop.on{display:block}
#pop .ph{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);padding:8px 12px 6px}
#pop button{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;text-align:left;padding:9px 12px;border-radius:10px;font-size:14.5px}
#pop button:hover{background:var(--raise)}
#pop button.sel{color:var(--acc)}
#pop .pn{font-size:12.5px;color:var(--mute);padding:8px 12px 6px;border-top:1px solid var(--line);margin-top:4px;line-height:1.45}
.fine{text-align:center;color:var(--dim);font-size:12px;margin:8px 0 0}

#toast{position:fixed;left:50%;bottom:calc(110px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--raise);border:1px solid var(--line2);
  padding:9px 16px;border-radius:12px;display:none;z-index:80;font-size:14px;max-width:88vw;text-align:center}

/* ================= profile page ================= */
#profile{position:fixed;inset:0;z-index:50;background:var(--bg);overflow:auto;opacity:0;pointer-events:none;transform:translateY(10px);transition:opacity .18s,transform .18s}
#profile.on{opacity:1;pointer-events:auto;transform:none}
.phead{display:flex;align-items:center;gap:6px;padding:calc(8px + env(safe-area-inset-top)) 10px 8px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:1}
.phead h2{font:400 22px/1 var(--serif);margin:0}
.pbody{max-width:560px;margin:0 auto;padding:18px 16px calc(40px + env(safe-area-inset-bottom))}
.pbody h3{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);font-weight:500;margin:26px 4px 10px}
.pcard{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:6px 16px}
.pcard.who{display:flex;align-items:center;gap:14px;padding:16px}
.pmail{font-weight:600;overflow-wrap:anywhere}
.psub{color:var(--mute);font-size:13.5px}
.prow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.prow:last-child{border-bottom:0}
.prow em{font-style:normal;font-size:12.5px;color:var(--dim)}
.prow.dis{color:var(--dim)}
.prow.vault{justify-content:flex-start}
.prow.vault>div{display:flex;flex-direction:column}
.btn{padding:8px 16px;border-radius:10px;border:1px solid var(--line2);font-size:14px;transition:background .15s}
.btn:hover{background:var(--raise)}
.btn.acc{border-color:var(--acc);color:var(--acc)}
.btn.danger{width:100%;margin-top:26px;padding:12px;color:var(--err);border-color:#4a2c2c}
.bar{height:8px;border-radius:99px;background:var(--raise);overflow:hidden;margin:12px 0 8px}
.bar i{display:block;height:100%;background:var(--acc);border-radius:99px;transition:width .4s}
.bar.low i{background:var(--warn)}
.banner{border:1px solid color-mix(in srgb,var(--warn) 40%,var(--line));background:color-mix(in srgb,var(--warn) 8%,transparent);color:var(--warn);border-radius:14px;padding:12px 14px;font-size:13.5px;margin-top:14px;line-height:1.5}
</style>
</head>
<body data-view="loading">

<!-- icon sprite: every icon in the app lives here -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h10"/></symbol>

<!-- ================= LOGIN / SIGN UP ================= -->
<section id="auth" aria-label="Sign in">
  <div class="acard">
    <h1 class="brand">Djlvorne</h1>
    <p class="tagline">Your whole AI stack on one quiet screen.</p>
    <div class="seg" id="aseg">
      <button type="button" data-a="in" class="on">Sign in</button>
      <button type="button" data-a="up">Create account</button>
    </div>
    <form id="aform" novalidate>
      <label class="fld"><span>Email</span>
        <input id="aem" type="email" inputmode="email" autocomplete="email" autocapitalize="off" spellcheck="false" required></label>
      <label class="fld"><span>Account password</span>
        <input id="apw" type="password" autocomplete="current-password" required></label>
      <label class="fld" id="vrow" hidden><span>Vault password</span>
        <input id="avp" type="password" autocomplete="new-password">
        <small class="hint">The vault protects your Locked chats and Notes. It has NO reset. If you forget it, those become permanently inaccessible. Use something different from your account password.</small>
      </label>
      <label class="chk"><input type="checkbox" id="showpw"> Show passwords</label>
      <p id="aerr" class="err" role="alert"></p>
      <button class="primary" id="asub" type="submit">Sign in</button>
    </form>
    <p class="afoot" id="afoot"></p>
  </div>
</section>

<!-- ================= MAIN APP ================= -->
<div id="app">
  <div id="scrim"></div>
  <aside id="side" aria-label="Chats">
    <div class="sh"><span id="sidehead"></span><button class="ib" id="sclose" aria-label="Close"><svg class="ic"><use href="#i-x"/></svg></button></div>
    <button id="newchat"><svg class="ic sm"><use href="#i-plus"/></svg>New chat</button>
    <div id="list"></div>
    <button class="sfoot" id="sfoot"><span class="av" id="sav"></span><span class="em" id="semail"></span></button>
  </aside>

  <header>
    <button class="ib" id="menu" aria-label="Chats"><svg class="ic"><use href="#i-menu"/></svg></button>
    <div class="word">Djlvorne</div>
    <button class="av" id="avbtn" aria-label="Profile"></button>
  </header>
  <nav id="tabs" role="tablist"></nav>

  <main id="log"><div class="col" id="col"></div></main>

  <div id="bar"><div class="col">
    <div id="thumb"><img alt="Attached image"><button aria-label="Remove image"><svg class="ic xs"><use href="#i-x"/></svg></button></div>
    <div class="box">
      <textarea id="inp" rows="1"></textarea>
      <div class="row">
        <button class="ib" id="add" aria-label="Upload image"><svg class="ic"><use href="#i-plus"/></svg></button>
        <input type="file" id="file" accept="image/*" hidden>
        <button id="model" aria-haspopup="listbox"></button>
        <div id="pop" role="listbox"></div>
        <button class="ib" id="send" aria-label="Send"><svg class="ic"><use href="#i-up"/></svg></button>
      </div>
    </div>
  </div></div>
</div>

<!-- ================= PROFILE PAGE ================= -->
<section id="profile" aria-label="Profile">
  <div class="phead">
    <button class="ib" id="pback" aria-label="Back"><svg class="ic"><use href="#i-back"/></svg></button>
    <h2>Profile</h2>
  </div>
  <div class="pbody">
    <div class="pcard who">
      <div class="av lg" id="pav"></div>
      <div><div class="pmail" id="pmail"></div><div class="psub" id="psub"></div></div>
    </div>
    <div class="banner" id="pbanner" hidden></div>

    <h3>Puter &middot; AI access</h3>
    <div class="pcard">
      <div class="prow"><span id="pstat">Checking&hellip;</span><button class="btn acc" id="pputer" hidden></button></div>
      <div id="pusage" hidden>
        <div class="bar" id="pbarwrap"><i id="pbar"></i></div>
        <div class="psub" id="ptxt" style="padding-bottom:12px"></div>
      </div>
    </div>

    <h3>Your chats</h3>
    <div class="pcard" id="pcounts"></div>

    <h3>Private space</h3>
    <div class="pcard">
      <div class="prow vault"><svg class="ic"><use href="#i-lock"/></svg><div><span>Vault password</span><span class="psub" id="pvault"></span></div></div>
      <div class="prow dis"><span>Locked chats</span><em>Coming in the next update</em></div>
      <div class="prow dis"><span>Notes</span><em>Coming in the next update</em></div>
    </div>

    <button class="btn danger" id="psignout">Sign out</button>
  </div>
</section>

<div id="toast" role="status"></div>

<script src="https://js.puter.com/v2/"></script>
<script src="firebase-config.js"></script>
<script src="auth.js"></script>

<script>
/* =====================================================================
   DJLVORNE: main app script
   Sections: 1 config  2 state  3 helpers  4 sign-in  5 tabs & sidebar
             6 drawing messages  7 talking to Puter  8 sending
             9 generating images/videos  10 profile page  11 start-up
   ===================================================================== */

/* ---------------- 1. CONFIG: modes and models ----------------
   Model IDs come from Puter's docs (checked Oct 2026). They change often,
   so at start-up the app asks Puter for its live list (puter.ai.listModels)
   and swaps these in. The lists below are the fallback if that call fails.
   `neg`  = the video model accepts a negative prompt.
   `i2v`  = a separate model ID used when a starting image is attached.
   `noimg`= model cannot read images (chat/brainstorm/code).               */
const MODES = {
  brainstorm: { label:'Brainstorm', icon:'bulb',  models:[ {id:'anthropic/claude-sonnet-5-5', label:'Claude Sonnet 5.5'} ] },
  chat:       { label:'Chat',       icon:'chat',  models:[
    {id:'anthropic/claude-sonnet-5-5', label:'Claude Sonnet 5.5'},
    {id:'anthropic/claude-haiku-5-5',  label:'Claude Haiku 5.5'},
    {id:'anthropic/claude-opus-5-5',   label:'Claude Opus 5.5'},
    {id:'anthropic/claude-fable-5-1',  label:'Claude Fable 5.1'} ] },
  image:      { label:'Image',      icon:'image', models:[
    {id:'google/gemini-2.5-flash-image', label:'Nano Banana (Gemini 2.5 Flash Image)'},
    {id:'gpt-image-1.5',                 label:'GPT Image 1.5'},
    {id:'gemini-3-pro-image-preview',    label:'Gemini 3 Pro Image'},
    {id:'grok-2-image',                  label:'Grok Image'} ] },
  video:      { label:'Video',      icon:'video', models:[
    {id:'kling-3.0-turbo',     label:'Kling 3.0 Turbo', neg:false},
    {id:'wan-ai/wan2.7-t2v',   label:'Wan 2.7',         neg:true, i2v:'wan-ai/wan2.7-i2v'},
    {id:'pixverse/pixverse-v6',label:'PixVerse V6',     neg:true},
    {id:'vidu/vidu-q3-turbo',  label:'Vidu Q3 Turbo',   neg:true} ] },
  code:       { label:'Code',       icon:'code',  models:[
    {id:'anthropic/claude-sonnet-5-5', label:'Claude Sonnet 5.5'},
    {id:'anthropic/claude-opus-5-5',   label:'Claude Opus 5.5'},
    {id:'anthropic/claude-fable-5-1',  label:'Claude Fable 5.1'} ] }
};
const MODE_KEYS = Object.keys(MODES);
let searchFound = false; // did Puter list any web-search model for Brainstorm?

/* Words shown on each mode's empty screen */
const COPY = {
  brainstorm:{ h:'What are we thinking through?', s:'Explore an idea, weigh options, find angles you missed.', ph:'Throw an idea at me…',
    chips:['Help me shape a rough startup idea','Compare two ways to learn guitar fast','Find fresh angles for a short film'] },
  chat:{ h:'What are we making?', s:'Ask, write, plan, explain. Drafts like emails get their own copy card.', ph:'Message Djlvorne',
    chips:['Draft a polite email asking for a deadline extension','Explain how a mortgage works, simply','Help me plan a focused week'] },
  image:{ h:'Describe a picture.', s:'Your rough idea becomes a polished prompt first, then the image.', ph:'Describe the picture you want…',
    chips:['A lighthouse in a storm, oil painting','A calm mountain at dawn, minimal poster','A cozy reading nook in warm evening light'] },
  video:{ h:'Describe a moment in motion.', s:'Your rough idea becomes a camera-ready prompt first, then the clip.', ph:'Describe the clip you want…',
    chips:['Slow push-in on a rainy neon street','A paper boat drifting down a quiet stream','Drone shot rising over a foggy forest'] },
  code:{ h:'What are we building?', s:'Write, explain, debug. Code always lands in its own copyable block.', ph:'Ask a coding question…',
    chips:['Write a Python script that renames files by date','Explain why I get "undefined is not a function"','Build a responsive navbar in plain CSS'] }
};

/* ---------------- 2. STATE ---------------- */
let U = null;                 // the signed-in Djlvorne user {uid,email,created}
let chats = [];               // every chat, each tagged with its own mode
let mode = 'chat';            // which tab is open
let sel = {};                 // chosen model id per mode
const curId = {};             // open chat id PER MODE (this is what keeps tabs separate)
const drafts = {};            // unsent text per mode
const imgs = {};              // attached image per mode (data URL)
const busy = {};              // is this mode waiting on the AI?
const genCache = {};          // generated image/video results, this session only
const attMem = {};            // starting image kept for the Generate button, this session only
const idFix = {};             // remembers a model-id spelling that worked

/* ---------------- 3. HELPERS ---------------- */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const icon = (n, c) => `<svg class="ic ${c||''}"><use href="#i-${n}"/></svg>`;
const K = n => `dj:${U.uid}:${n}`;
const initial = e => (e || '?').trim().charAt(0).toUpperCase();

function toast(t) {
  const e = $('#toast'); e.textContent = t; e.style.display = 'block';
  clearTimeout(toast.t); toast.t = setTimeout(() => e.style.display = 'none', 2800);
}
function copy(t) { navigator.clipboard.writeText(t).then(() => toast('Copied'), () => toast('Copy failed')); }

function errText(e) {
  if (!e) return 'Unknown error';
  if (typeof e === 'string') return e;
  const m = e.message || (e.error && e.error.message) || (typeof e.error === 'string' ? e.error : '') || e.msg;
  const c = e.code || (e.error && e.error.code);
  if (m) return c && !String(m).includes(c) ? `${m} (${c})` : String(m);
  try { return JSON.stringify(e); } catch (_) { return String(e); }
}
function friendly(e) {
  const t = errText(e);
  if (/insufficient_funds/i.test(t)) return 'Your Puter allowance is used up for now. Check Profile for details.';
  if (/moderation/i.test(t)) return 'The provider’s content filter refused this prompt. Try rewording it.';
  if (/not found|unknown model|bad_request/i.test(t)) return t + ' — this model ID may be out of date. Pick another model from the list.';
  return t;
}
const NOTFOUND = /not found|unknown model|no such model|invalid model|model_not/i;
function altId(id) {            // try the other spelling of a Claude model id
  if (!/claude/i.test(id)) return id;
  return id.includes('/') ? id.slice(id.lastIndexOf('/') + 1) : 'anthropic/' + id;
}

function save() {
  try {
    const clean = chats.map(c => ({ ...c, msgs: c.msgs.filter(m => !m.pending) }));
    localStorage.setItem(K('chats'), JSON.stringify(clean));
  } catch (_) { toast('Storage is full. Delete some chats.'); }
}
const curChat = () => chats.find(c => c.id === curId[mode]) || null;
const modelObj = (m, id) => MODES[m].models.find(x => x.id === id) || { id, label: id };

/* Shrinks big photos so they upload quickly and fit Puter's size limits */
function shrink(dataUrl, max = 1600) {
  return new Promise(ok => {
    const im = new Image();
    im.onload = () => {
      const k = Math.min(1, max / Math.max(im.width, im.height));
      if (k === 1 && dataUrl.length < 1.5e6) return ok(dataUrl);
      const c = document.createElement('canvas');
      c.width = Math.round(im.width * k); c.height = Math.round(im.height * k);
      c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
      ok(c.toDataURL('image/jpeg', .88));
    };
    im.onerror = () => ok(dataUrl);
    im.src = dataUrl;
  });
}

/* ---------------- 4. SIGN-IN SCREEN ---------------- */
let amode = 'in';
function showView(v) { document.body.dataset.view = v; }
function setAuthMode(a) {
  amode = a;
  document.querySelectorAll('#aseg button').forEach(b => b.classList.toggle('on', b.dataset.a === a));
  $('#vrow').hidden = a !== 'up';
  $('#asub').textContent = a === 'up' ? 'Create account' : 'Sign in';
  $('#apw').autocomplete = a === 'up' ? 'new-password' : 'current-password';
  $('#aerr').textContent = '';
}
$('#aseg').onclick = e => { const b = e.target.closest('button'); if (b) setAuthMode(b.dataset.a); };
$('#showpw').onchange = e => {
  $('#apw').type = $('#avp').type = e.target.checked ? 'text' : 'password';
};
$('#afoot').textContent = DjAuth.kind === 'firebase'
  ? 'Accounts are secured by Firebase. Your Puter login is separate and powers the AI.'
  : 'Device-only mode: accounts live in this browser only. Add your Firebase keys in firebase-config.js for real accounts that work on any device.';

$('#aform').onsubmit = async e => {
  e.preventDefault();
  const email = $('#aem').value.trim(), pw = $('#apw').value, vp = $('#avp').value, err = $('#aerr');
  err.textContent = '';
  if (!/^\S+@\S+\.\S+$/.test(email)) { err.textContent = 'Enter a valid email address.'; return; }
  if (pw.length < 6) { err.textContent = 'Password needs at least 6 characters.'; return; }
  if (amode === 'up') {
    if (vp.length < 6) { err.textContent = 'Vault password needs at least 6 characters.'; return; }
    if (vp === pw) { err.textContent = 'Vault password must be different from your account password.'; return; }
  }
  const btn = $('#asub'); btn.disabled = true; btn.textContent = 'One moment…';
  try {
    const user = amode === 'up' ? await DjAuth.signUp(email, pw, vp) : await DjAuth.signIn(email, pw);
    $('#apw').value = $('#avp').value = '';
    enter(user);
  } catch (ex) { err.textContent = errText(ex); }
  btn.disabled = false; btn.textContent = amode === 'up' ? 'Create account' : 'Sign in';
};

/* ---------------- 5. TABS, MODEL PICKER, SIDEBAR ---------------- */
function drawTabs() {
  $('#tabs').innerHTML = MODE_KEYS.map(k =>
    `<button class="tab${k === mode ? ' on' : ''}" data-m="${k}" role="tab" aria-selected="${k === mode}">${icon(MODES[k].icon, 'sm')}<span>${MODES[k].label}</span></button>`
  ).join('');
}
$('#tabs').onclick = e => { const b = e.target.closest('.tab'); if (b && b.dataset.m !== mode) setMode(b.dataset.m); };

/* Switching tabs: park this tab's draft text, load the other tab's chat */
function setMode(m) {
  drafts[mode] = $('#inp').value;
  mode = m;
  $('#inp').value = drafts[m] || '';
  $('#inp').placeholder = COPY[m].ph;
  $('#pop').classList.remove('on');
  grow(); drawTabs(); drawModel(); drawList(); drawLog(); drawThumb(); updateSend();
}

function drawModel() {
  const ms = MODES[mode].models;
  if (!ms.some(x => x.id === sel[mode])) sel[mode] = ms[0].id;
  const now = ms.find(x => x.id === sel[mode]);
  $('#model').innerHTML = `<span>${esc(now.label)}</span>${icon('down', 'xs')}`;
  const ch = curChat();
  const longText = ch && ch.msgs.length > 8 && mode !== 'image' && mode !== 'video';
  $('#pop').innerHTML = `<div class="ph">${MODES[mode].label} models</div>` +
    ms.map(x => `<button class="${x.id === sel[mode] ? 'sel' : ''}" data-v="${esc(x.id)}" role="option">${esc(x.label)}${x.id === sel[mode] ? icon('check', 'sm') : ''}</button>`).join('') +
    (longText ? '<div class="pn">Long chats use more of your Puter allowance, because the whole history goes to the new model.</div>' : '');
}
$('#model').onclick = e => { e.stopPropagation(); $('#pop').classList.toggle('on'); };
$('#pop').onclick = e => {
  const b = e.target.closest('button'); if (!b) return;
  sel[mode] = b.dataset.v;
  try { localStorage.setItem(K('sel'), JSON.stringify(sel)); } catch (_) {}
  drawModel(); $('#pop').classList.remove('on');
};
document.addEventListener('click', () => $('#pop').classList.remove('on'));

function side(open) { $('#side').classList.toggle('open', open); $('#scrim').classList.toggle('on', open); }
$('#menu').onclick = () => side(true);
$('#sclose').onclick = $('#scrim').onclick = () => side(false);

function drawList() {
  $('#sidehead').textContent = MODES[mode].label + ' chats';
  const mine = chats.filter(c => c.mode === mode)
    .sort((a, b) => (b.pin ? 1 : 0) - (a.pin ? 1 : 0) || b.id - a.id);
  $('#list').innerHTML = mine.map(c =>
    `<div class="ci${c.id === curId[mode] ? ' cur' : ''}">
       <button class="ti" data-o="${c.id}">${esc(c.title)}</button>
       <button class="ac${c.pin ? ' on' : ''}" data-p="${c.id}" aria-label="${c.pin ? 'Unpin' : 'Pin'}">${icon('pin', 'sm')}</button>
       <button class="ac" data-d="${c.id}" aria-label="Delete">${icon('trash', 'sm')}</button>
     </div>`).join('') || `<div class="snone">No ${MODES[mode].label.toLowerCase()} chats yet.</div>`;
}
$('#list').onclick = e => {
  const b = e.target.closest('button'); if (!b) return;
  const d = b.dataset;
  if (d.o) { curId[mode] = Number(d.o); side(false); drawList(); drawLog(); drawModel(); }
  if (d.p) { const c = chats.find(x => String(x.id) === d.p); c.pin = !c.pin; save(); drawList(); }
  if (d.d && confirm('Delete this chat? This cannot be undone.')) {
    chats = chats.filter(x => String(x.id) !== d.d);
    if (String(curId[mode]) === d.d) curId[mode] = null;
    save(); drawList(); drawLog();
  }
};
$('#newchat').onclick = () => { curId[mode] = null; side(false); drawList(); drawLog(); drawModel(); $('#inp').focus(); };
$('#sfoot').onclick = $('#avbtn').onclick = () => { side(false); openProfile(); };

/* ---------------- 6. DRAWING MESSAGES ---------------- */
function inline(s) {
  return esc(s).replace(/`([^`\n]+)`/g, '<code>$1</code>').replace(/\*\*([^*\n]+)\*\*/g, '<b>$1</b>');
}
function textBlock(s) {         // tiny markdown: paragraphs, headings, bullet and numbered lists
  let h = '', list = '';
  const close = () => { if (list) { h += `</${list}>`; list = ''; } };
  for (const ln of s.trim().split('\n')) {
    let m;
    if ((m = ln.match(/^\s*[-*•]\s+(.*)/))) { if (list !== 'ul') { close(); h += '<ul>'; list = 'ul'; } h += `<li>${inline(m[1])}</li>`; continue; }
    if ((m = ln.match(/^\s*\d+[.)]\s+(.*)/)))    { if (list !== 'ol') { close(); h += '<ol>'; list = 'ol'; } h += `<li>${inline(m[1])}</li>`; continue; }
    close();
    if ((m = ln.match(/^#{1,4}\s+(.*)/))) { h += `<h4>${inline(m[1])}</h4>`; continue; }
    if (ln.trim()) h += `<p>${inline(ln)}</p>`;
  }
  close(); return h;
}
function render(text) {         // splits on ``` : odd pieces are code blocks
  return text.split('```').map((s, i) => {
    if (i % 2) {
      const body = s.replace(/^[\w+#.-]*\n/, '').replace(/\n$/, '');
      return `<div class="code"><pre>${esc(body)}</pre><button class="cp">${icon('copy', 'sm')}Copy</button></div>`;
    }
    return s.trim() ? textBlock(s) : '';
  }).join('');
}

function emptyHTML() {
  const c = COPY[mode];
  const hint = mode === 'brainstorm' && !searchFound
    ? '<p class="note" style="margin-top:18px">No web-search model was listed by Puter, so Brainstorm is using Claude for now.</p>' : '';
  return `<div class="empty"><div class="eglyph">${icon(MODES[mode].icon, 'lg')}</div>
    <h2>${c.h}</h2><p>${c.s}</p>
    <div class="chips">${c.chips.map(t => `<button class="chip" data-t="${esc(t)}">${esc(t)}</button>`).join('')}</div>${hint}</div>`;
}

function fillMsg(d, msg) {      // (re)builds the inside of one message
  if (msg.role === 'user') {
    d.innerHTML = (msg.hasImg ? '<div class="tag">image attached</div>' : '') + (msg.text ? `<div class="t">${esc(msg.text)}</div>` : '');
    return;
  }
  d.dataset.raw = msg.text || '';
  if (msg.error) { d.innerHTML = `<div class="note err">${esc(msg.error)}</div>`; return; }
  if (!msg.text) { d.innerHTML = '<div class="dots"><i></i><i></i><i></i></div>'; return; }
  d.innerHTML = render(msg.text);
  if (msg.pending) return;
  if (msg.shots) wireShots(d, msg);
  else d.insertAdjacentHTML('beforeend', `<button class="cp all">${icon('copy', 'sm')}Copy reply</button>`);
}
function addMsg(msg) {
  const d = document.createElement('div');
  d.className = 'm ' + (msg.role === 'user' ? 'u' : 'a');
  d.dataset.id = msg.id;
  fillMsg(d, msg);
  $('#col').appendChild(d);
  return d;
}
function drawLog() {            // shows ONLY the current mode's current chat
  const ch = curChat(), col = $('#col');
  col.innerHTML = '';
  if (!ch || !ch.msgs.length) { col.innerHTML = emptyHTML(); return; }
  ch.msgs.forEach(addMsg);
  $('#log').scrollTop = 1e9;
}
function paint(msg) {           // live-update one message (finds it fresh, so it survives tab switches)
  const el = $('#col').querySelector(`[data-id="${msg.id}"]`);
  if (!el) return;
  const log = $('#log'), near = log.scrollHeight - log.scrollTop - log.clientHeight < 140;
  fillMsg(el, msg);
  if (near) log.scrollTop = 1e9;
}

$('#col').onclick = e => {
  const chip = e.target.closest('.chip');
  if (chip) { $('#inp').value = chip.dataset.t; grow(); updateSend(); $('#inp').focus(); return; }
  const b = e.target.closest('.cp'); if (!b) return;
  copy(b.classList.contains('all') ? b.closest('.m').dataset.raw : b.closest('.code').querySelector('pre').textContent);
};

/* ---------------- 7. TALKING TO PUTER ---------------- */
const textOf = r => typeof r === 'string' ? r
  : (Array.isArray(r && r.message && r.message.content) ? r.message.content.map(p => p.text || '').join('')
    : ((r && r.message && r.message.content) || (r && r.text) || ''));

/* Streams a reply. If Puter says "model not found", retries once with the
   other spelling of the id (with or without the "anthropic/" prefix).      */
async function ask(msgs, model, onTxt, image, lastText) {
  const run = async id => {
    const o = { model: id, stream: true };
    const r = image ? await puter.ai.chat(lastText || 'Describe this image.', image, o) : await puter.ai.chat(msgs, o);
    let acc = '';
    if (r && typeof r[Symbol.asyncIterator] === 'function') {
      for await (const p of r) { acc += (p && p.text) || ''; onTxt(acc); }
      return acc;
    }
    const t = textOf(r); onTxt(t); return t;
  };
  const first = idFix[model] || model;
  try { return await run(first); }
  catch (e) {
    if (!NOTFOUND.test(errText(e))) throw e;
    const alt = altId(first);
    if (alt === first) throw e;
    const out = await run(alt);
    idFix[model] = alt;
    return out;
  }
}
const enhancerId = () => MODES.chat.models[0].id;

/* Asks Puter which models really exist right now and updates the pickers */
async function loadModels() {
  try {
    if (!window.puter || !puter.ai || !puter.ai.listModels) return;
    const list = await puter.ai.listModels();
    if (!Array.isArray(list) || !list.length) return;
    const find = bare => list.find(m => String(m.id).split('/').pop() === bare || (m.aliases || []).includes(bare));
    const pick = bares => bares.map(find).filter(Boolean).map(m => ({ id: m.id, label: m.name || m.id }));
    const claude = pick(['claude-sonnet-5-5', 'claude-haiku-5-5', 'claude-opus-5-5', 'claude-fable-5-1']);
    if (claude.length) {
      MODES.chat.models = claude;
      MODES.code.models = claude.filter(m => !/haiku/i.test(m.id)).length ? claude.filter(m => !/haiku/i.test(m.id)) : claude;
    }
    const search = list.filter(m => /sonar|perplexity/i.test(m.id)).slice(0, 3)
      .map(m => ({ id: m.id, label: (m.name || m.id) + ' · web search', noimg: true }));
    searchFound = search.length > 0;
    MODES.brainstorm.models = [...search, ...(claude.length ? claude.slice(0, 1) : MODES.brainstorm.models)];
    drawModel();
  } catch (_) { /* keep the built-in fallback lists */ }
}

/* ---------------- 8. SENDING ---------------- */
function grow() { const t = $('#inp'); t.style.height = 'auto'; t.style.height = Math.min(t.scrollHeight, innerHeight * .3) + 'px'; }
function updateSend() { $('#send').classList.toggle('ready', !!($('#inp').value.trim() || imgs[mode])); }
$('#inp').oninput = () => { grow(); updateSend(); };
$('#inp').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey && matchMedia('(hover:hover)').matches) { e.preventDefault(); send(); }
});
$('#send').onclick = send;

async function send() {
  const m = mode, raw = $('#inp').value.trim(), att = imgs[m] || null;
  if ((!raw && !att) || busy[m]) return;
  if (!window.puter) { toast('Puter did not load. Check your connection.'); return; }
  const mdl = modelObj(m, sel[m]);
  if (att && mdl.noimg) { toast(mdl.label + ' cannot read images. Pick another model or remove the image.'); return; }

  // Puter needs its own sign-in once. Do it first, while this tap still counts as a user action.
  if (!puter.auth.isSignedIn()) {
    try { await puter.auth.signIn(); } catch (_) { toast('Sign in to Puter to use the AI.'); return; }
  }

  busy[m] = true;
  drafts[m] = ''; imgs[m] = null;
  if (mode === m) { $('#inp').value = ''; grow(); drawThumb(); updateSend(); }

  let ch = chats.find(c => c.id === curId[m]);
  if (!ch) {
    ch = { id: Date.now(), mode: m, title: (raw || 'Image').slice(0, 40), pin: false, msgs: [] };
    chats.push(ch); curId[m] = ch.id;
  }
  const um = { id: uid(), role: 'user', text: raw, hasImg: !!att };
  const am = { id: uid(), role: 'assistant', text: '', pending: true, shots: m === 'image' || m === 'video', mode: m };
  ch.msgs.push(um, am);
  if (att) attMem[am.id] = att;
  save();
  if (mode === m) { drawList(); drawLog(); drawModel(); }

  try {
    if (m === 'image' || m === 'video') {
      if (att && m === 'image') toast('Reference images are not wired into the Image tab yet.');
      const sys = m === 'image' ? IMAGE_PROMPT : VIDEO_PROMPT;
      const full = await ask(
        [{ role: 'system', content: sys }, { role: 'user', content: raw || '(a starting image is attached)' }],
        enhancerId(), t => { am.text = t; paint(am); });
      am.text = full; am.pending = false; paint(am);
      if (shotsOf(full).length === 1) {
        const g = $('#col').querySelector(`[data-id="${am.id}"] .gen`);
        if (g) g.click();
      }
    } else {
      const prior = ch.msgs.slice(0, -2).filter(x => x.text && !x.error).map(x => ({ role: x.role, content: x.text }));
      const full = await ask([...prior, { role: 'user', content: raw }], sel[m], t => { am.text = t; paint(am); }, att, raw);
      am.text = full; am.pending = false; paint(am);
    }
  } catch (e) {
    am.text = ''; am.pending = false; am.error = 'Something went wrong: ' + friendly(e);
    paint(am);
  }
  save(); busy[m] = false;
}

/* image upload (per mode) */
function drawThumb() {
  const a = imgs[mode];
  $('#thumb').style.display = a ? 'block' : 'none';
  if (a) $('#thumb img').src = a;
}
$('#add').onclick = () => $('#file').click();
$('#file').onchange = e => {
  const f = e.target.files[0], m = mode; e.target.value = '';
  if (!f) return;
  const r = new FileReader();
  r.onload = async () => { imgs[m] = await shrink(r.result); if (m === mode) { drawThumb(); updateSend(); } };
  r.readAsDataURL(f);
};
$('#thumb button').onclick = () => { imgs[mode] = null; drawThumb(); updateSend(); };

/* ---------------- 9. GENERATING IMAGES / VIDEOS ---------------- */
function shotsOf(t) {
  const m = [...t.matchAll(/```[\w-]*\n?([\s\S]*?)```/g)].map(x => x[1].trim()).filter(Boolean);
  return m.length ? m : [t.trim()];
}
function showResult(out, r) {
  out.innerHTML = '';
  const n = document.createElement(r.type === 'video' ? 'video' : 'img');
  n.src = r.src;
  if (r.type === 'video') { n.controls = true; n.playsInline = true; n.preload = 'metadata'; } else n.alt = 'Generated image';
  out.appendChild(n);
  const a = document.createElement('a'); a.href = r.src; a.target = '_blank'; a.rel = 'noopener'; a.textContent = 'Open full size';
  out.appendChild(a);
}
function wireShots(d, msg) {    // adds a Generate button under every prompt block
  d.querySelectorAll('.code').forEach((c, i) => {
    const g = document.createElement('button'); g.className = 'gen'; g.textContent = 'Generate';
    const o = document.createElement('div'); o.className = 'out';
    c.after(g, o);
    const hit = genCache[msg.id + ':' + i];
    if (hit) { showResult(o, hit); g.textContent = 'Generate again'; }
    g.onclick = () => generate(msg, i, c.querySelector('pre').textContent, o, g);
  });
}
async function generate(msg, i, prompt, out, btn) {
  const m = msg.mode, mdl = modelObj(m, sel[m]);
  btn.disabled = true; btn.textContent = 'Generating…';
  out.innerHTML = `<div class="note">${m === 'video' ? 'Videos can take a few minutes. You can switch tabs while you wait.' : 'Working on it…'}</div>`;
  try {
    let el;
    if (m === 'image') {
      el = await puter.ai.txt2img(prompt, { model: mdl.id });
    } else {
      // Pull the "Negative:" line off the prompt. Only send it to models that take one.
      let p = prompt, neg = '';
      const nm = p.match(/\n?\s*Negative:\s*(.*)$/im);
      if (nm) { neg = nm[1].trim(); p = p.replace(nm[0], '').trim(); }
      const o = { model: mdl.id };
      if (neg && mdl.neg) o.negative_prompt = neg;
      const start = attMem[msg.id];
      if (start) { o.input_reference = start; if (mdl.i2v) o.model = mdl.i2v; } // starting image = first frame
      el = await puter.ai.txt2vid(p, o);
    }
    const r = { type: m === 'video' ? 'video' : 'image', src: el.src || String(el) };
    genCache[msg.id + ':' + i] = r;
    showResult(out, r);
    btn.textContent = 'Generate again';
  } catch (e) {
    out.innerHTML = `<div class="note err">${esc(friendly(e))}</div>`;
    btn.textContent = 'Retry';
  }
  btn.disabled = false;
}

/* ---------------- 10. PROFILE PAGE ---------------- */
function openProfile() {
  $('#pav').textContent = initial(U.email);
  $('#pmail').textContent = U.email;
  $('#psub').textContent = 'Member since ' + new Date(U.created).toLocaleDateString(undefined, { year: 'numeric', month: 'long', day: 'numeric' });
  $('#pvault').textContent = DjAuth.hasVault(U.uid) ? 'Set. It cannot be reset.' : 'Not set on this device.';
  const bn = $('#pbanner');
  bn.hidden = DjAuth.kind === 'firebase';
  bn.textContent = 'Device-only mode: this account exists only in this browser. Add your Firebase keys to firebase-config.js to get real accounts.';
  $('#pcounts').innerHTML = MODE_KEYS.map(k =>
    `<div class="prow"><span>${MODES[k].label}</span><em>${chats.filter(c => c.mode === k).length} chats</em></div>`).join('');
  $('#profile').classList.add('on');
  refreshPuter();
}
$('#pback').onclick = () => $('#profile').classList.remove('on');

async function refreshPuter() {
  const stat = $('#pstat'), btn = $('#pputer'), use = $('#pusage');
  use.hidden = true;
  if (!window.puter) { stat.textContent = 'Puter did not load. Check your connection.'; btn.hidden = true; return; }
  let signed = false;
  try { signed = puter.auth.isSignedIn(); } catch (_) {}
  btn.hidden = false;
  if (!signed) {
    stat.textContent = 'Not signed in to Puter';
    btn.textContent = 'Sign in to Puter';
    btn.onclick = async () => { try { await puter.auth.signIn(); } catch (_) { toast('Puter sign-in was cancelled.'); } refreshPuter(); };
    return;
  }
  let name = '';
  try { name = (await puter.auth.getUser()).username || ''; } catch (_) {}
  stat.textContent = name ? 'Signed in as ' + name : 'Signed in to Puter';
  btn.textContent = 'Sign out of Puter';
  btn.onclick = async () => { try { await puter.auth.signOut(); } catch (_) {} refreshPuter(); };
  try {
    const u = await puter.auth.getMonthlyUsage(), a = u && u.allowanceInfo;
    if (a && a.monthUsageAllowance > 0) {
      const total = a.monthUsageAllowance, left = Math.max(0, a.remaining), pct = Math.max(0, Math.min(100, (total - left) / total * 100));
      const usd = v => '$' + (v / 1e8).toFixed(2);   // Puter counts in microcents
      $('#pbar').style.width = pct + '%';
      $('#pbarwrap').classList.toggle('low', left / total < .15);
      $('#ptxt').textContent = left <= 0 ? 'Your monthly allowance is used up.'
        : `${usd(left)} left of ${usd(total)} this month` + (left / total < .15 ? '. Running low.' : '');
      use.hidden = false;
    }
  } catch (_) { /* usage is a nice-to-have */ }
}
$('#psignout').onclick = async () => {
  try { await DjAuth.signOut(); } catch (_) {}
  location.reload();
};

/* ---------------- 11. START-UP ---------------- */
function loadUserData() {
  let saved = null;
  try { saved = JSON.parse(localStorage.getItem(K('chats'))); } catch (_) {}
  if (!saved) {                                  // first time: adopt chats from the very first version of the app
    try { saved = JSON.parse(localStorage.getItem('dj_chats') || 'null'); if (saved) localStorage.removeItem('dj_chats'); } catch (_) {}
  }
  chats = Array.isArray(saved) ? saved : [];
  chats.forEach(c => {
    c.msgs = (c.msgs || []).filter(x => !x.pending);
    c.mode = c.mode || ((c.msgs.find(x => x.mode) || {}).mode) || 'chat';
    c.msgs.forEach((x, i) => { x.id = x.id || (c.id + '-' + i); });
  });
  try { sel = JSON.parse(localStorage.getItem(K('sel'))) || {}; } catch (_) { sel = {}; }
  MODE_KEYS.forEach(k => { if (!sel[k]) sel[k] = MODES[k].models[0].id; curId[k] = null; drafts[k] = ''; imgs[k] = null; busy[k] = false; });
}
function enter(user) {
  U = user;
  loadUserData();
  $('#avbtn').textContent = $('#sav').textContent = initial(U.email);
  $('#semail').textContent = U.email;
  mode = 'chat';
  $('#inp').value = ''; $('#inp').placeholder = COPY[mode].ph;
  drawTabs(); drawModel(); drawList(); drawLog(); drawThumb(); updateSend();
  showView('app');
  loadModels();
}
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if ($('#profile').classList.contains('on')) $('#profile').classList.remove('on'); else side(false);
});

(async function boot() {
  setAuthMode('in');
  try {
    const user = await DjAuth.init();
    if (user) enter(user); else showView('auth');
  } catch (e) {
    showView('auth');
    $('#aerr').textContent = errText(e);
  }
})();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
