<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#141414">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<title>Djlvorne</title>
<style>
:root{--bg:#141414;--panel:#1c1c1c;--line:#2c2c2c;--txt:#e8e8e8;--mute:#8a8a8a;--acc:#7aa2f7}
*{box-sizing:border-box}html,body{height:100%;margin:0;background:var(--bg);color:var(--txt);font:15px/1.55 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
body{display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,textarea:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
header{display:flex;align-items:center;gap:6px;padding:10px 12px;padding-top:calc(10px + env(safe-area-inset-top));border-bottom:1px solid var(--line)}
#menu{font-size:20px;padding:4px 8px}
#tabs{display:flex;gap:4px;overflow-x:auto;flex:1}
.tab{padding:6px 12px;border-radius:8px;color:var(--mute);white-space:nowrap}
.tab.on{background:var(--panel);color:var(--txt)}
#side{position:fixed;inset:0 25% 0 0;max-width:320px;background:var(--panel);border-right:1px solid var(--line);transform:translateX(-100%);transition:transform .2s;z-index:20;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
#side.open{transform:none}
#scrim{position:fixed;inset:0;background:#0008;z-index:10;display:none}#scrim.on{display:block}
#newchat{margin:12px;padding:10px;border:1px solid var(--line);border-radius:10px}
#list{overflow-y:auto;flex:1}
.ci{display:flex;align-items:center;padding:8px 12px;gap:4px}.ci.cur{background:#262626}
.ci .ti{flex:1;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ci .ac{color:var(--mute);padding:2px 6px}
#log{flex:1;overflow-y:auto;padding:16px 12px;max-width:760px;width:100%;margin:0 auto}
.empty{color:var(--mute);text-align:center;margin-top:20vh}
.m{margin:0 0 18px}.m.u{background:var(--panel);padding:10px 14px;border-radius:14px;margin-left:15%}
.m .t{white-space:pre-wrap;overflow-wrap:anywhere}
.code{position:relative;background:#0f0f0f;border:1px solid var(--line);border-radius:10px;margin:8px 0}
.code pre{margin:0;padding:12px;white-space:pre-wrap;overflow-wrap:anywhere;font:13px/1.5 ui-monospace,Menlo,Consolas,monospace}
.cp,.gen{display:block;margin:0 8px 8px auto;padding:4px 12px;border:1px solid var(--line);border-radius:8px;color:var(--mute);font-size:13px}
.cp:hover,.gen:hover{color:var(--txt)}.gen{color:var(--acc);border-color:var(--acc)}
.out img,.out video{max-width:100%;border-radius:10px;margin:0 8px 8px}
.note{color:var(--mute);font-size:13px;padding:0 8px 8px}
#bar{max-width:760px;width:100%;margin:0 auto;padding:8px 12px 12px}
#thumb{display:none;position:relative;width:64px;margin-bottom:8px}#thumb img{width:64px;height:64px;object-fit:cover;border-radius:10px}
#thumb button{position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;background:var(--line);font-size:12px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:8px}
textarea{width:100%;resize:none;background:none;border:0;color:var(--txt);font:inherit;padding:6px 8px;max-height:30vh}
.row{display:flex;align-items:center;gap:6px;position:relative}
.ib{width:36px;height:36px;border-radius:50%;font-size:20px;color:var(--mute)}.ib:hover{background:#2a2a2a;color:var(--txt)}
#model{padding:6px 12px;border-radius:18px;color:var(--mute);font-size:13px}#model:hover{background:#2a2a2a}
#send{margin-left:auto;background:var(--acc);color:#0b0b0b;font-weight:600}
#pop{display:none;position:absolute;left:40px;bottom:46px;background:#222;border:1px solid var(--line);border-radius:12px;padding:4px;min-width:220px;z-index:5}
#pop.on{display:block}#pop button{display:block;width:100%;text-align:left;padding:8px 12px;border-radius:8px}
#pop button:hover,#pop button.sel{background:#2d2d2d}#pop button.sel{color:var(--acc)}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#333;padding:8px 14px;border-radius:10px;display:none;z-index:30}
</style></head>
<body>
<div id="scrim"></div>
<aside id="side"><button id="newchat">New chat</button><div id="list"></div></aside>
<header><button id="menu" aria-label="Chats">&#9776;</button><nav id="tabs"></nav></header>
<main id="log"></main>
<div id="bar">
 <div id="thumb"><img alt="attached"><button aria-label="Remove image">&#10005;</button></div>
 <div class="box">
  <textarea id="inp" rows="1" placeholder="Message Djlvorne"></textarea>
  <div class="row">
   <button class="ib" id="add" aria-label="Upload image">+</button>
   <input type="file" id="file" accept="image/*" hidden>
   <button id="model"></button>
   <div id="pop"></div>
   <button class="ib" id="send" aria-label="Send">&#8593;</button>
  </div>
 </div>
</div>
<div id="toast"></div>
<script src="https://js.puter.com/v2/"></script>
<script src="prompts.js"></script>
<script>
/* ===== CONFIG: model IDs are UNVERIFIED. Check Puter's current model list and edit here. ===== */
const ENHANCER='claude-sonnet-4-5';
const MODES={
 brainstorm:{label:'Brainstorm',models:['perplexity/sonar','claude-sonnet-4-5']}, // search-capable models still to be verified
 chat:{label:'Chat',models:['claude-sonnet-4-5','claude-opus-4-5','claude-haiku-4-5']},
 image:{label:'Image',models:['gemini-2.5-flash-image-preview','gpt-image-1']},
 video:{label:'Video',models:['kling','wan','pixverse','vidu']}, // exact Puter video model IDs to be verified
 code:{label:'Code',models:['claude-sonnet-4-5','claude-opus-4-5']}
};
const $=s=>document.querySelector(s);
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
let chats=JSON.parse(localStorage.getItem('dj_chats')||'[]'),cur=null,mode='chat',sel={},img=null,busy=false;
Object.keys(MODES).forEach(k=>sel[k]=MODES[k].models[0]);
const save=()=>localStorage.setItem('dj_chats',JSON.stringify(chats));
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',2600)}
function copy(t){navigator.clipboard.writeText(t).then(()=>toast('Copied'),()=>toast('Copy failed'))}

/* ---- tabs, sidebar ---- */
function drawTabs(){$('#tabs').innerHTML=Object.keys(MODES).map(k=>`<button class="tab ${k===mode?'on':''}" data-m="${k}">${MODES[k].label}</button>`).join('');drawModel()}
$('#tabs').onclick=e=>{const m=e.target.dataset.m;if(m){mode=m;drawTabs()}};
function drawModel(){$('#model').textContent=sel[mode]+' \u25B4';
 $('#pop').innerHTML=MODES[mode].models.map(m=>`<button class="${m===sel[mode]?'sel':''}" data-v="${m}">${m}</button>`).join('')}
$('#model').onclick=e=>{e.stopPropagation();$('#pop').classList.toggle('on')};
$('#pop').onclick=e=>{const v=e.target.dataset.v;if(v){sel[mode]=v;drawModel();$('#pop').classList.remove('on')}};
document.addEventListener('click',()=>$('#pop').classList.remove('on'));
function side(o){$('#side').classList.toggle('open',o);$('#scrim').classList.toggle('on',o)}
$('#menu').onclick=()=>side(true);$('#scrim').onclick=()=>side(false);
function drawList(){const s=[...chats].sort((a,b)=>(b.pin?1:0)-(a.pin?1:0)||b.id-a.id);
 $('#list').innerHTML=s.map(c=>`<div class="ci ${c===cur?'cur':''}"><button class="ti" data-o="${c.id}">${c.pin?'\u2605 ':''}${esc(c.title)}</button><button class="ac" data-p="${c.id}" aria-label="Pin">\u2606</button><button class="ac" data-d="${c.id}" aria-label="Delete">\u2715</button></div>`).join('')||'<p class="note">No chats yet.</p>'}
$('#list').onclick=e=>{const d=e.target.dataset;
 if(d.o){cur=chats.find(c=>c.id==d.o);side(false);drawList();drawLog()}
 if(d.p){const c=chats.find(c=>c.id==d.p);c.pin=!c.pin;save();drawList()}
 if(d.d&&confirm('Delete this chat? This cannot be undone.')){chats=chats.filter(c=>c.id!=d.d);if(cur&&cur.id==d.d)cur=null;save();drawList();drawLog()}};
$('#newchat').onclick=()=>{cur=null;side(false);drawList();drawLog()};

/* ---- rendering ---- */
function render(text){return text.split('```').map((s,i)=>i%2?
 `<div class="code"><pre>${esc(s.replace(/^[\w-]*\n/,'').trim())}</pre><button class="cp">Copy</button></div>`
 :(s.trim()?`<div class="t">${esc(s.trim())}</div>`:'')).join('')}
function bubble(role,text){const d=document.createElement('div');d.className='m '+(role==='user'?'u':'a');
 d.dataset.raw=text;d.innerHTML=role==='user'?`<div class="t">${esc(text)}</div>`:render(text)+(text?'<button class="cp all">Copy reply</button>':'');
 $('#log').appendChild(d);$('#log').scrollTop=1e9;return d}
function drawLog(){const l=$('#log');l.innerHTML='';
 if(!cur||!cur.msgs.length){l.innerHTML='<div class="empty">What are we making?</div>';return}
 cur.msgs.forEach(m=>{const b=bubble(m.role,m.text);if(m.shots)wireShots(b,m.mode)})}
$('#log').onclick=e=>{const b=e.target.closest('.cp');if(!b)return;
 copy(b.classList.contains('all')?b.closest('.m').dataset.raw:b.previousElementSibling.textContent)};

/* ---- AI helpers ---- */
const txt=r=>typeof r==='string'?r:(Array.isArray(r?.message?.content)?r.message.content.map(p=>p.text||'').join(''):(r?.message?.content||r?.text||''));
async function ask(msgs,model,onTxt,image){
 const o={model,stream:!!onTxt};let r,acc='';
 r=image?await puter.ai.chat(msgs[msgs.length-1].content,image,o):await puter.ai.chat(msgs,o);
 if(!onTxt)return txt(r);
 for await(const p of r){acc+=p?.text||'';onTxt(acc)}return acc}

/* ---- image / video generation ---- */
function shotsOf(t){const m=[...t.matchAll(/```[\w-]*\n?([\s\S]*?)```/g)].map(x=>x[1].trim()).filter(Boolean);return m.length?m:[t.trim()]}
function wireShots(b,m){b.querySelectorAll('.code').forEach(c=>{
 const g=document.createElement('button');g.className='gen';g.textContent='Generate';
 const o=document.createElement('div');o.className='out';c.after(g,o);
 g.onclick=()=>generate(c.querySelector('pre').textContent,m,o,g)})}
async function generate(prompt,m,out,btn){
 const model=sel[m];btn.disabled=true;btn.textContent='Generating\u2026';
 try{
  if(m==='video'){prompt=prompt.replace(/\n?\s*Negative:.*$/im,'').trim()} // TODO: only strip where model has no negative field
  const el=m==='image'?await puter.ai.txt2img(prompt,{model}):await puter.ai.txt2vid(prompt,{model});
  out.innerHTML='';out.appendChild(el);if(m==='video'){el.controls=true}
  btn.textContent='Generate again'
 }catch(e){out.innerHTML=`<div class="note">Generation failed: ${esc(e?.message||JSON.stringify(e))}. Check the model ID in CONFIG.</div>`;btn.textContent='Retry'}
 btn.disabled=false}

/* ---- send ---- */
async function send(){
 const raw=$('#inp').value.trim();if((!raw&&!img)||busy)return;
 if(!window.puter){toast('Puter did not load. Check your connection.');return}
 busy=true;const m=mode,att=img;$('#inp').value='';grow();clearImg();
 if(!cur){cur={id:Date.now(),title:raw.slice(0,40)||'New chat',pin:false,msgs:[]};chats.push(cur)}
 cur.msgs.push({role:'user',text:raw});if(cur.msgs.length===1)drawLog();else bubble('user',raw);
 if($('.empty'))drawLog();
 const b=bubble('assistant','');b.innerHTML='<div class="t">\u2026</div>';
 try{
  if(m==='image'||m==='video'){
   if(att)toast('Image attached as reference is not wired for generation yet.');
   const sys=m==='image'?IMAGE_PROMPT:VIDEO_PROMPT;
   const full=await ask([{role:'system',content:sys},{role:'user',content:raw}],ENHANCER,t=>{b.dataset.raw=t;b.innerHTML=render(t)});
   b.dataset.raw=full;b.innerHTML=render(full);wireShots(b,m);
   cur.msgs.push({role:'assistant',text:full,shots:true,mode:m});
   if(shotsOf(full).length===1)b.querySelector('.gen')?.click();
  }else{
   const hist=cur.msgs.slice(0,-1).map(x=>({role:x.role,content:x.text}));
   const msgs=[...hist,{role:'user',content:raw}];
   const full=await ask(msgs,sel[m],t=>{b.dataset.raw=t;b.innerHTML=render(t)},att);
   b.dataset.raw=full;b.innerHTML=render(full)+'<button class="cp all">Copy reply</button>';
   cur.msgs.push({role:'assistant',text:full})}
 }catch(e){b.innerHTML=`<div class="note">Something went wrong: ${esc(e?.message||JSON.stringify(e))}</div>`}
 save();drawList();busy=false;$('#log').scrollTop=1e9}
$('#send').onclick=send;
$('#inp').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&matchMedia('(hover:hover)').matches){e.preventDefault();send()}});
function grow(){const t=$('#inp');t.style.height='auto';t.style.height=Math.min(t.scrollHeight,window.innerHeight*.3)+'px'}
$('#inp').oninput=grow;

/* ---- image upload ---- */
$('#add').onclick=()=>$('#file').click();
$('#file').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();
 r.onload=()=>{img=r.result;$('#thumb img').src=img;$('#thumb').style.display='block'};r.readAsDataURL(f);e.target.value=''};
function clearImg(){img=null;$('#thumb').style.display='none'}
$('#thumb button').onclick=clearImg;

drawTabs();drawList();drawLog();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
